    // Terapkan tema sebelum halaman tampil, supaya tidak berkedip gelap lalu terang.
    try {
      const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
      const p = read('orion-device') || read('orion-prefs') || {}; // sama dengan services/prefs.js
      const light = p.theme === 'light' || (p.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.lang = p.lang === 'en' ? 'en' : 'id';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F4EFFF' : '#1B1035');
    } catch (e) { /* abaikan */ }
